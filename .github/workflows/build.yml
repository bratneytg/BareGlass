name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK
        # API_BASE: en GitHub → Settings → Variables → Actions, p. ej. https://api.tudominio.com
        run: gradle assembleDebug --no-daemon --stacktrace -PapiBase="${{ vars.API_BASE }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BareGlass-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK de demostración (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BareGlass-demo.apk
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo BareGlass-demo.apk --prerelease --target "$GITHUB_SHA" \
            --title "BareGlass · demo" --notes "APK de demostración (firmado en modo debug). Usuarios de prueba: demo@bareglass.test / premium@bareglass.test · contraseña Prueba123!"
