# Un VPS pequeño (≈4 €/mes) con: API + copia continua de la base de datos + HTTPS automático.
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - bgdata:/data
    expose: ["8000"]

  litestream:                       # replica la base de datos a almacenamiento barato (Backblaze B2 / Cloudflare R2)
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - bgdata:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  caddy:                            # HTTPS con certificado gratuito
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]

volumes:
  bgdata:
  caddydata:
